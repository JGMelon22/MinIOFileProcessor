services:
  fileuploaderparta.api:
    image: ${DOCKER_REGISTRY-}fileuploaderpartaapi
    build:
      context: .
      dockerfile: src/FileUploaderPartA.API/Dockerfile
    depends_on:
      - kafka
      - rustfs
      - mysql
      - otel-collector
    environment:
      ConnectionStrings__Default: "Server=mysql;Database=minio_process;Uid=root;Pwd=Melon@123;Connection Timeout=60"

      ASPNETCORE_URLS: http://+:8080

      AWS__ServiceURL: "http://rustfs:9000"
      AWS__AccessKey: "rustfsadmin"
      AWS__SecretKey: "rustfsadmin"
      AWS__BucketName: "my-bucket"

      Kafka__Endpoint: "kafka:9092"
      OtlpExporter__Endpoint: "http://otel-collector:4317"
    ports:
      - "8080:8080"
    networks:
      - app-network

  kafka:
    image: apache/kafka-native:4.3.1
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
    networks:
      - app-network

  # danielqsj Kafka Exporter
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: kafka-exporter
    hostname: kafka-exporter
    ports:
      - "9308:9308"
    command:
      - '--kafka.server=kafka:9092'
      - '--web.listen-address=:9308'
      - '--log.level=info'
    depends_on:
      - kafka
    restart: unless-stopped
    networks:
      - app-network

  rustfs:
    image: rustfs/rustfs:1.0.0-beta.11
    container_name: rustfs
    hostname: rustfs
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    command: /data
    networks:
      - app-network

  mysql:
    image: mysql:8.4.6
    container_name: mysql
    hostname: mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: Melon@123
      MYSQL_DATABASE: minio_process
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.132.2
    container_name: otel-collector
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    command:
      - '--config'
      - '/etc/otel-collector-config.yaml'
    ports:
      - "4317:4317"
      - 8889:8889
    depends_on:
      - jaeger
    networks:
      - app-network

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: jaeger
    ports:
      - 16686:16686
      - 14268
      - 14250
    networks:
      - app-network

  seq:
    image: datalust/seq:2021.1
    container_name: seq
    hostname: seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    ports:
      - 5341:5341
      - 8081:80
    volumes:
      - seq_data:/data
    networks:
      - app-network

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    user: "nobody"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - app-network

  grafana:
    image: grafana/grafana-oss:13.0.2
    container_name: grafana
    user: "472"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  rustfs_data:
  mysql_data:
  prometheus_data:
  grafana_data:
  seq_data:
